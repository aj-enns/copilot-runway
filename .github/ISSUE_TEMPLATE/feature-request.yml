name: Preview feature request
description: Suggest an official-source-backed Copilot feature for the runway.
title: "[Feature] "
body:
  - type: markdown
    attributes:
      value: |
        Keep customer, personal, confidential, and credential information out of this repository.
        A candidate is not a verified feature or readiness recommendation.
  - type: input
    id: feature
    attributes:
      label: Feature name and supported surface
      placeholder: Computer Use in Copilot CLI
    validations:
      required: true
  - type: input
    id: source
    attributes:
      label: Official primary source URL
      description: Use github.com, docs.github.com, github.blog, or GitHub's official project docs.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Lifecycle evidence and enterprise questions
      description: Separate documented facts from assumptions and unknowns.
    validations:
      required: true
  - type: textarea
    id: demo
    attributes:
      label: Bounded customer demo and reset idea
      description: Synthetic data only; include the intended measurable result and cleanup boundary.
